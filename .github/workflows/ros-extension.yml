name: ROS extension build and policy
on:
  push:
    paths: ['src/uwvm2/imported/ros/**', 'src/uwvm2/uwvm/imported/ros/**', 'src/uwvm2/uwvm/cmdline/**', 'src/uwvm2/runtime/**', 'tests/ros*/**', 'sdk/**', 'gateways/**', '.github/workflows/ros-extension.yml']
  pull_request:
    paths: ['src/uwvm2/imported/ros/**', 'src/uwvm2/uwvm/imported/ros/**', 'src/uwvm2/uwvm/cmdline/**', 'src/uwvm2/runtime/**', 'tests/ros*/**', 'sdk/**', 'gateways/**', '.github/workflows/ros-extension.yml']
jobs:
  interpreter-products:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [none, ros1, ros2, dual]
    steps:
      - uses: actions/checkout@v4
      - name: C++26 compiler
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc >/dev/null
          sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble main'
          sudo apt-get update
          sudo apt-get install -y clang-23 libc++-23-dev libc++abi-23-dev wabt
      - name: Independent product, without ROS development libraries
        env:
          CXX: clang++-23
        run: python3 tests/ros/build_product.py --profile '${{ matrix.profile }}' --out "$RUNNER_TEMP/ros-product"
      - name: Policy, handle, message and IPC unit tests
        if: matrix.profile == 'dual'
        env:
          CXX: clang++-23
          ROS_TEST_CXXFLAGS: -std=c++26 -stdlib=libc++ -O1 -g0
        run: |
          python3 tests/ros/run_unit.py --out "$RUNNER_TEMP/ros-unit"
          python3 tests/ros_cli/run.py --uwvm "$RUNNER_TEMP/ros-product/dual/uwvm" --output "$RUNNER_TEMP/ros-cli.json"
      - name: Existing WASI, Memory64, tail-call and Trusted DL regression
        env:
          CC: clang-23
        run: python3 tests/ros/regression.py --uwvm "$RUNNER_TEMP/ros-product/${{ matrix.profile }}/uwvm" --out "$RUNNER_TEMP/ros-regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-${{ matrix.profile }}-build-evidence
          path: |
            ${{ runner.temp }}/ros-product/*/*.log
            ${{ runner.temp }}/ros-product/*/commands.json
            ${{ runner.temp }}/ros-product/results.json
            ${{ runner.temp }}/ros-product/source-manifest.json
            ${{ runner.temp }}/ros-unit/*.log
            ${{ runner.temp }}/ros-unit/results.json
            ${{ runner.temp }}/ros-cli.json
            ${{ runner.temp }}/ros-regression/**
