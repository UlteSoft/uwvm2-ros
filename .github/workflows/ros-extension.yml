name: ROS extension build and policy
on:
  push:
    paths: ['src/uwvm2/imported/ros/**', 'src/uwvm2/uwvm/imported/ros/**', 'src/uwvm2/uwvm/cmdline/**', 'src/uwvm2/runtime/**', 'test/0073.ros-tests/support/source/ros*/**', 'tools/ci/linux_smoke/**', 'sdk/**', 'gateways/**', '.github/workflows/ros-extension.yml']
  pull_request:
    paths: ['src/uwvm2/imported/ros/**', 'src/uwvm2/uwvm/imported/ros/**', 'src/uwvm2/uwvm/cmdline/**', 'src/uwvm2/runtime/**', 'test/0073.ros-tests/support/source/ros*/**', 'tools/ci/linux_smoke/**', 'sdk/**', 'gateways/**', '.github/workflows/ros-extension.yml']
jobs:
  interpreter-products:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [none, ros1, ros2, dual]
    steps:
      - uses: actions/checkout@v4
      - name: Pinned C++26 compiler and WABT
        run: |
          python3 -B tools/ci/linux_smoke/prepare_products.py \
            --work "$RUNNER_TEMP/ros-providers" --out "$RUNNER_TEMP/ros-provider-evidence"
      - name: Independent product, without ROS development libraries
        env:
          CXX: ${{ env.UWVM_CI_CXX }}
        run: python3 test/0073.ros-tests/support/source/ros/build_product.py --profile '${{ matrix.profile }}' --stdlib libstdc++ --out "$RUNNER_TEMP/ros-product"
      - name: Policy, handle, message and IPC unit tests
        if: matrix.profile == 'dual'
        env:
          CXX: ${{ env.UWVM_CI_CXX }}
          ROS_TEST_CXXFLAGS: -std=c++26 -stdlib=libstdc++ -O1 -g0
        run: |
          python3 test/0073.ros-tests/support/source/ros/run_unit.py --out "$RUNNER_TEMP/ros-unit"
          python3 test/0073.ros-tests/support/source/ros_cli/run.py --uwvm "$RUNNER_TEMP/ros-product/dual/uwvm2-ros" --output "$RUNNER_TEMP/ros-cli.json"
      - name: Existing WASI, Memory64, tail-call and Trusted DL regression
        env:
          CC: ${{ env.UWVM_CI_CC }}
        run: python3 test/0073.ros-tests/support/source/ros/regression.py --uwvm "$RUNNER_TEMP/ros-product/${{ matrix.profile }}/uwvm2-ros" --wat2wasm '${{ env.UWVM_CI_WAT2WASM }}' --out "$RUNNER_TEMP/ros-regression"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-${{ matrix.profile }}-build-evidence
          path: |
            ${{ runner.temp }}/ros-provider-evidence/**
            ${{ runner.temp }}/ros-product/*/*.log
            ${{ runner.temp }}/ros-product/*/commands.json
            ${{ runner.temp }}/ros-product/results.json
            ${{ runner.temp }}/ros-product/source-manifest.json
            ${{ runner.temp }}/ros-unit/*.log
            ${{ runner.temp }}/ros-unit/results.json
            ${{ runner.temp }}/ros-cli.json
            ${{ runner.temp }}/ros-regression/**
