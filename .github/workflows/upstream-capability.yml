name: Upstream Uwvm2 capability / separate immutable source
on:
  schedule:
    - cron: '47 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros-product-global-qualification
  cancel-in-progress: false

jobs:
  ordinary-interpreter:
    name: Ordinary Uwvm2 full interpreter strict suite / no ROS product
    if: github.ref == 'refs/heads/main' && github.repository == 'UlteSoft/uwvm2-ros'
    runs-on: [self-hosted, linux, ros-x86_64-cgroup64]
    timeout-minutes: 350
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ADMISSION: ${{ vars.ROS_X86_64_ADMISSION }}
      LLVM23_PREFIX: ${{ vars.ROS_X86_64_LLVM23_PREFIX }}
      UPSTREAM_SOURCE: ${{ github.workspace }}/upstream-control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: UlteSoft/uwvm2
          ref: 999bb9439024b3c2adba54044b8374910efa411d
          path: upstream-control
          persist-credentials: false
      - name: Record the distinct upstream source identity
        run: |
          EVIDENCE="$RUNNER_TEMP/upstream-capability-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'EVIDENCE=%s\n' "$EVIDENCE" >> "$GITHUB_ENV"
          python3 -B test/0080.product-qualification/receipt.py init --source "$UPSTREAM_SOURCE" --out "$EVIDENCE" --lane ordinary-upstream-full-interpreter --require interpreter
      - name: Guard and execute every strict interpreter target from that source
        run: |
          python3 -B test/0080.product-qualification/receipt.py command --out "$EVIDENCE" --id interpreter --dimension execution --timeout 19500 --subject .github/scripts/upstream-interpreter.sh --subject test/0080.product-qualification/guarded.py --subject test/0080.product-qualification/receipt.py -- \
            python3 -B test/0080.product-qualification/guarded.py --source "$GITHUB_WORKSPACE" --admission "$ADMISSION" --out "$EVIDENCE/resources.json" -- \
            bash .github/scripts/upstream-interpreter.sh
      - name: Retain the upstream driver's complete log
        if: always()
        run: |
          if test -f "$UPSTREAM_SOURCE/build/uwvm_int_basic_full.log"; then cp "$UPSTREAM_SOURCE/build/uwvm_int_basic_full.log" "$EVIDENCE/"; fi
      - name: Seal upstream-only evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 -B test/0080.product-qualification/receipt.py seal --out "$EVIDENCE" --job-status "$JOB_STATUS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ordinary-upstream-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
