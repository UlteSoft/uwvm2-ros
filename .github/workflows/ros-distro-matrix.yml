name: Explicit native ROS distribution matrix

# SDK provisioning is deliberately separate. A missing EOL repository/image
# does not become a skipped green native build. The runner administrator supplies
# a reviewed closed host-profile list with local SDK/sysroot trees; the runner
# may itself be the user's already admitted container. Automatic OCI/rootfs
# daemon launch is fail-closed. No package download or tool installation is
# performed by the native job, and it never changes the existing baseline lane.
on:
  pull_request:
    paths: ['tools/ros_distro/**', 'tests/ros_distro/**', 'gateways/**', '.github/workflows/ros-distro-matrix.yml']
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Absolute self-hosted path to reviewed profile-list JSON (at least two distributions)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ros-distro-native-serial
  cancel-in-progress: false

jobs:
  configuration-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pure configuration contracts; no native compatibility claim
        run: PYTHONDONTWRITEBYTECODE=1 python3 -B tests/ros_distro/test_profiles.py

  actual-native-matrix:
    if: github.event_name == 'workflow_dispatch'
    needs: configuration-contracts
    runs-on: [self-hosted, linux, ros-sdk, ros-cgroup64]
    timeout-minutes: 360
    # There is one matrix process; each selected profile builds with -j1 and
    # completes cleanup before the next profile. CI does not fan out containers.
    strategy:
      max-parallel: 1
      matrix:
        lane: [serial]
    env:
      PROFILE_LIST: ${{ inputs.profiles }}
      PYTHONDONTWRITEBYTECODE: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Freeze all source, including the new tools
        run: |
          python3 -B tests/ros_acceptance/freeze_source.py --source "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/ros-distro-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --extra "tools/ros_distro=$GITHUB_WORKSPACE/tools/ros_distro"
      - name: Actual Gateway build and native SDK topic per selected distribution
        run: |
          FROZEN="$RUNNER_TEMP/ros-distro-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B "$FROZEN/source/tools/ros_distro/matrix.py" --source "$FROZEN/source" --source-manifest "$FROZEN/source-manifest.json" --profiles "$PROFILE_LIST" --out "$RUNNER_TEMP/ros-distro-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --minimum-distributions 2 --require-behavior
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-distro-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ros-distro-source-${{ github.run_id }}-${{ github.run_attempt }}/source-manifest.json
            ${{ runner.temp }}/ros-distro-source-${{ github.run_id }}-${{ github.run_attempt }}/freeze.json
            ${{ runner.temp }}/ros-distro-results-${{ github.run_id }}-${{ github.run_attempt }}/**/report.json
            ${{ runner.temp }}/ros-distro-results-${{ github.run_id }}-${{ github.run_attempt }}/**/commands.json
            ${{ runner.temp }}/ros-distro-results-${{ github.run_id }}-${{ github.run_attempt }}/**/*.log
            ${{ runner.temp }}/ros-distro-results-${{ github.run_id }}-${{ github.run_attempt }}/**/*.jsonl
          retention-days: 14
