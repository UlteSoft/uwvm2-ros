name: CI / static file analysis
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-analysis:
    name: Static files only / no execution acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Initialize static-only evidence before checkout or analysis
        id: initialize
        run: |
          STATIC_EVIDENCE="$RUNNER_TEMP/static-files-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'STATIC_EVIDENCE=%s\n' "$STATIC_EVIDENCE" >> "$GITHUB_ENV"
          python3 -I -S -B - "$STATIC_EVIDENCE" <<'PY'
          import json, pathlib, sys
          out = pathlib.Path(sys.argv[1])
          out.mkdir(mode=0o700)
          report = {'schema_version': 1, 'status': 'INITIALIZED_STATIC_ONLY', 'static_only': True,
                    'init_argv': sys.orig_argv, 'init_executable': sys.executable, 'stages': {}, 'source_inputs': [],
                    'execution_acceptance': False, 'functional_tests_run': False,
                    'repository_modules_imported': False, 'compiler_or_probe_run': False,
                    'analysis_complete': False, 'scope': 'commit whitespace and bounded CI/helper Python AST only'}
          (out / 'static-receipt.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Capture bounded whitespace and AST file-analysis results
        id: analysis
        timeout-minutes: 2
        run: |
          python3 -I -S -B - "$STATIC_EVIDENCE" <<'PY'
          import ast, contextlib, hashlib, json, os, pathlib, resource, signal, stat, subprocess, sys, time
          out, root = pathlib.Path(sys.argv[1]), pathlib.Path.cwd().resolve()
          receipt = out / 'static-receipt.json'
          report = json.loads(receipt.read_text())
          report.update(status='RUNNING', analysis_argv=sys.orig_argv, analysis_executable=sys.executable,
                        source_root=str(root), analysis_complete=False, stages={}, source_inputs=[])
          def save():
              temporary = receipt.with_suffix('.new')
              temporary.write_text(json.dumps(report, indent=2) + '\n')
              temporary.replace(receipt)
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def streams(name):
              return out / (name + '.stdout'), out / (name + '.stderr')
          def finish_streams(row, name):
              for label, path in zip(('stdout', 'stderr'), streams(name)):
                  row[label] = {'path': path.name, 'bytes': path.stat().st_size, 'sha256': digest(path)}
          def command(name, argv):
              row = {'argv': argv, 'cwd': str(root), 'executed': False, 'status': 'FAIL', 'returncode': None}
              report['stages'][name] = row
              stdout, stderr = streams(name)
              child, began = None, time.monotonic()
              try:
                  with stdout.open('xb') as output, stderr.open('xb') as errors:
                      child = subprocess.Popen(argv, cwd=root, stdin=subprocess.DEVNULL, stdout=output,
                                               stderr=errors, start_new_session=True)
                      row.update(executed=True, pid=child.pid)
                      while child.poll() is None:
                          if time.monotonic() - began > 20:
                              row['reason'] = 'bounded metadata command timeout'
                              break
                          if max(stdout.stat().st_size, stderr.stat().st_size) > 512 * 1024:
                              row['reason'] = 'bounded metadata command output limit'
                              break
                          time.sleep(0.02)
                      if child.poll() is None:
                          os.killpg(child.pid, signal.SIGKILL)
                      row['returncode'] = child.wait(timeout=5)
                      if max(stdout.stat().st_size, stderr.stat().st_size) > 512 * 1024:
                          row['reason'] = 'bounded metadata command output limit'
                      if row['returncode'] == 0 and 'reason' not in row:
                          row['status'] = 'PASS'
              except Exception as error:
                  row['reason'] = type(error).__name__ + ': ' + str(error)[:2048]
                  if child is not None and child.poll() is None:
                      os.killpg(child.pid, signal.SIGKILL)
                      child.wait(timeout=5)
              finally:
                  for path in (stdout, stderr):
                      path.touch(exist_ok=True)
                  row['seconds'] = time.monotonic() - began
                  finish_streams(row, name)
                  save()
              return row
          save()
          try:
              resource.setrlimit(resource.RLIMIT_CPU, (30, 30))
              resource.setrlimit(resource.RLIMIT_AS, (512 * 1024**2, 512 * 1024**2))
              resource.setrlimit(resource.RLIMIT_FSIZE, (1024**2, 1024**2))
              workflow = root / '.github/workflows/ci.yml'
              if workflow.is_symlink() or not workflow.resolve(strict=True).is_relative_to(root) or workflow.stat().st_size > 128 * 1024:
                  raise ValueError('workflow source must be a bounded in-checkout regular file')
              report['workflow_source'] = {'path': '.github/workflows/ci.yml', 'bytes': workflow.stat().st_size, 'sha256': digest(workflow)}
              git = ['git', '-c', 'core.fsmonitor=false', '-c', 'core.hooksPath=/dev/null']
              head = command('head', [*git, 'rev-parse', '--verify', 'HEAD^{commit}'])
              parent = command('parent', [*git, 'rev-parse', '--verify', 'HEAD^'])
              if parent['status'] != 'PASS':
                  parent.update(status='BLOCKED', reason='HEAD^ unavailable: initial commit or incomplete history; whitespace is not checked')
              roots = ['.github/scripts', 'tools/ci', 'test/0080.product-qualification',
                       'test/0006.check_module', 'test/0073.ros-tests/support/source/ros_distro',
                       'test/0073.ros-tests/support/source/ros']
              report['selection_roots'] = roots
              selection = command('selection', [*git, 'ls-files', '-z', '--', *roots])
              names = []
              if selection['status'] == 'PASS':
                  names = sorted({os.fsdecode(name) for name in (out / 'selection.stdout').read_bytes().split(b'\0') if name.endswith(b'.py')})
              inputs = {'status': 'PASS', 'selected_files': len(names), 'total_bytes': 0, 'largest_file_bytes': 0,
                        'bounds': {'files': 256, 'total_bytes': 16 * 1024**2, 'file_bytes': 1024**2}}
              report['stages']['source-inputs'] = inputs
              if not names or len(names) > 256 or selection['status'] != 'PASS':
                  inputs.update(status='FAIL', reason='selection failed or tracked Python count is outside 1..256')
              else:
                  for name in names:
                      row = {'path': name, 'status': 'FAIL'}
                      report['source_inputs'].append(row)
                      try:
                          relative, path = pathlib.Path(name), root / name
                          if relative.is_absolute() or '..' in relative.parts or not stat.S_ISREG(path.lstat().st_mode) or not path.resolve(strict=True).is_relative_to(root):
                              raise ValueError('static input must be an in-checkout regular file')
                          size = path.stat().st_size
                          row['bytes'] = size
                          inputs['total_bytes'] += size
                          inputs['largest_file_bytes'] = max(inputs['largest_file_bytes'], size)
                          if size > 1024**2 or inputs['total_bytes'] > 16 * 1024**2:
                              raise ValueError('static source byte bound exceeded; AST is not run')
                          data = path.read_bytes()
                          if len(data) != size:
                              raise ValueError('source changed while reading')
                          row.update(status='HASHED', sha256=hashlib.sha256(data).hexdigest())
                      except Exception as error:
                          row['reason'] = type(error).__name__ + ': ' + str(error)[:2048]
                          inputs['status'] = 'FAIL'
              save()
              whitespace_argv = [*git, 'diff', '--no-ext-diff', '--no-textconv', '--check', 'HEAD^', 'HEAD']
              if head['status'] == parent['status'] == 'PASS':
                  command('whitespace', whitespace_argv)
              else:
                  row = {'status': 'BLOCKED', 'executed': False, 'planned_argv': whitespace_argv,
                         'reason': 'A verified HEAD and HEAD^ are required; no empty-tree or silent initial-commit fallback'}
                  report['stages']['whitespace'] = row
                  for path in streams('whitespace'):
                      path.write_bytes(b'')
                  finish_streams(row, 'whitespace')
              ast_row = {'status': 'BLOCKED', 'operation': 'ast.parse of each hashed source; no imports/eval',
                         'controller_argv': sys.orig_argv, 'parsed_files': 0}
              report['stages']['ast'] = ast_row
              stdout, stderr = streams('ast')
              with stdout.open('x') as output, stderr.open('x') as errors, contextlib.redirect_stdout(output), contextlib.redirect_stderr(errors):
                  if inputs['status'] != 'PASS':
                      ast_row['reason'] = 'source selection or byte/type/hash bounds failed; no source is parsed'
                      print(ast_row['reason'], file=sys.stderr)
                  else:
                      ast_row['status'] = 'PASS'
                      for row in report['source_inputs']:
                          try:
                              data = (root / row['path']).read_bytes()
                              if hashlib.sha256(data).hexdigest() != row['sha256']:
                                  raise ValueError('source changed after hashing')
                              ast.parse(data.decode('utf-8-sig'), filename=row['path'])
                              row['parse_status'] = 'PASS'
                              ast_row['parsed_files'] += 1
                          except Exception as error:
                              ast_row['status'] = row['parse_status'] = 'FAIL'
                              row['parse_error'] = {'type': type(error).__name__, 'message': str(getattr(error, 'msg', error))[:2048],
                                                    'line': getattr(error, 'lineno', None), 'offset': getattr(error, 'offset', None)}
                              print(json.dumps({'path': row['path'], **row['parse_error']}), file=sys.stderr)
                      print('AST file analysis: ' + str(ast_row['parsed_files']) + '/' + str(len(report['source_inputs'])))
              finish_streams(ast_row, 'ast')
              report['analysis_complete'] = True
          except BaseException as error:
              report['analysis_error'] = {'type': type(error).__name__, 'message': str(error)[:2048]}
              (out / 'analysis-exception.stderr').write_text(json.dumps(report['analysis_error']) + '\n')
          finally:
              required = ['head', 'parent', 'selection', 'source-inputs', 'whitespace', 'ast']
              report['required_stages'] = required
              report['missing_required'] = [name for name in required if name not in report['stages']]
              statuses = {row['status'] for row in report['stages'].values()}
              report['status'] = ('FAIL' if report.get('analysis_error') or report['missing_required'] or 'FAIL' in statuses
                                  else 'BLOCKED' if 'BLOCKED' in statuses else 'STATIC_FILE_CHECKS_PASS')
              report['execution_acceptance'] = False
              report['functional_tests_run'] = report['repository_modules_imported'] = report['compiler_or_probe_run'] = False
              save()
          print(report['status'] + ': file analysis only; no execution acceptance')
          raise SystemExit(0 if report['status'] == 'STATIC_FILE_CHECKS_PASS' and report['analysis_complete'] else 1)
          PY
      - name: Always seal static-only evidence including failures or skipped analysis
        if: always()
        env:
          INIT_OUTCOME: ${{ steps.initialize.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        run: |
          STATIC_EVIDENCE="${STATIC_EVIDENCE:-$RUNNER_TEMP/static-files-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}"
          python3 -I -S -B - "$STATIC_EVIDENCE" <<'PY'
          import hashlib, json, os, pathlib, stat, sys
          out, root = pathlib.Path(sys.argv[1]), pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()
          out.mkdir(parents=True, exist_ok=True, mode=0o700)
          receipt = out / 'static-receipt.json'
          errors = []
          try:
              report = json.loads(receipt.read_text())
              if not isinstance(report, dict):
                  raise ValueError('static receipt is not an object')
          except Exception as error:
              report = {'status': 'FAIL', 'stages': {}, 'source_inputs': []}
              errors.append('missing/invalid initialized receipt: ' + str(error)[:2048])
              if receipt.is_file() and not receipt.is_symlink() and receipt.stat().st_size <= 1024**2:
                  raw = receipt.read_bytes()
                  (out / 'invalid-unsealed-receipt.raw').write_bytes(raw)
                  report['invalid_unsealed_receipt_sha256'] = hashlib.sha256(raw).hexdigest()
          report['step_outcomes'] = {name: os.environ.get(name + '_OUTCOME', 'unknown') for name in ('INIT', 'CHECKOUT', 'ANALYSIS')}
          report['seal_argv'], report['seal_executable'] = sys.orig_argv, sys.executable
          try:
              required = ['head', 'parent', 'selection', 'source-inputs', 'whitespace', 'ast']
              stages = report.get('stages', {})
              report['missing_required'] = [name for name in required if name not in stages]
              if report['missing_required'] or not report.get('analysis_complete'):
                  errors.append('analysis incomplete or required stage missing')
              for name in ('head', 'parent', 'selection', 'whitespace', 'ast'):
                  row = stages.get(name, {})
                  for label in ('stdout', 'stderr'):
                      relative = name + '.' + label
                      path = out / relative
                      if not path.is_file() or path.is_symlink() or path.stat().st_size > 1024**2:
                          errors.append('missing/nonregular/oversized output: ' + relative)
                          continue
                      current = {'path': relative, 'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
                      if row.get(label) != current:
                          errors.append('missing/mismatched command output receipt: ' + relative)
              for row in report.get('source_inputs', []):
                  if 'sha256' not in row:
                      errors.append('unhashed selected source: ' + row.get('path', '<missing>'))
                      continue
                  name = pathlib.Path(row['path'])
                  path = root / name
                  if name.is_absolute() or '..' in name.parts or not stat.S_ISREG(path.lstat().st_mode) or not path.resolve(strict=True).is_relative_to(root):
                      errors.append('source is no longer a regular in-checkout file')
                      continue
                  if path.stat().st_size != row['bytes'] or path.stat().st_size > 1024**2 or hashlib.sha256(path.read_bytes()).hexdigest() != row['sha256']:
                      errors.append('source hash/size changed: ' + str(name))
              workflow = root / '.github/workflows/ci.yml'
              if workflow.is_file() and not workflow.is_symlink() and workflow.resolve().is_relative_to(root) and workflow.stat().st_size <= 128 * 1024:
                  report['workflow_source_after'] = {'path': '.github/workflows/ci.yml', 'bytes': workflow.stat().st_size,
                                                    'sha256': hashlib.sha256(workflow.read_bytes()).hexdigest()}
                  if report.get('workflow_source') != report['workflow_source_after']:
                      errors.append('analysis workflow source missing or changed')
              else:
                  errors.append('workflow source unavailable')
          except Exception as error:
              errors.append('sealing exception: ' + type(error).__name__ + ': ' + str(error)[:2048])
          finally:
              report.update(static_only=True, execution_acceptance=False, functional_tests_run=False,
                            repository_modules_imported=False, compiler_or_probe_run=False, sealed=True)
              stages, sources = report.get('stages', {}), report.get('source_inputs', [])
              passed = (not errors and report.get('status') == 'STATIC_FILE_CHECKS_PASS'
                        and report.get('analysis_complete') and not report.get('analysis_error')
                        and all(value == 'success' for value in report['step_outcomes'].values())
                        and all(stages.get(name, {}).get('status') == 'PASS' for name in required)
                        and bool(sources) and stages.get('ast', {}).get('parsed_files') == len(sources)
                        and all(row.get('parse_status') == 'PASS' for row in sources))
              report['static_file_analysis_passed'] = bool(passed)
              report['status'] = 'STATIC_FILE_CHECKS_PASS' if passed else 'BLOCKED' if not errors and report.get('status') == 'BLOCKED' else 'FAIL'
              report['sealing_errors'] = errors
              artifacts = {}
              try:
                  for path in sorted(out.iterdir()):
                      if path.name in ('static-receipt.json', 'static-receipt.new', 'artifact-manifest.json'):
                          continue
                      if not path.is_file() or path.is_symlink() or path.stat().st_size > 1024**2:
                          raise ValueError('unexpected static artifact: ' + path.name)
                      artifacts[path.name] = {'bytes': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
                  manifest = out / 'artifact-manifest.json'
                  manifest.write_text(json.dumps(artifacts, indent=2) + '\n')
                  report['artifact_manifest_sha256'] = hashlib.sha256(manifest.read_bytes()).hexdigest()
              except Exception as error:
                  report.update(status='FAIL', static_file_analysis_passed=False)
                  errors.append('artifact sealing failed: ' + str(error)[:2048])
              temporary = receipt.with_suffix('.new')
              temporary.write_text(json.dumps(report, indent=2) + '\n')
              temporary.replace(receipt)
          print(report['status'] + ': static-only receipt sealed; no execution acceptance')
          raise SystemExit(0 if report['static_file_analysis_passed'] else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: static-files-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/static-files-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
