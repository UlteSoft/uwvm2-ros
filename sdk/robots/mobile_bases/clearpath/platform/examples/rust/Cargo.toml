[package]
name="uwvm-clearpath-example"
version="0.1.0"
edition="2021"
publish=false
[lib]
path="lib.rs"
[[bin]]
name="clearpath-state"
path="main.rs"
[features]
default=[]
noetic=["roswasm/ros1"]
noetic_husky=["roswasm/ros1"]
noetic_jackal=["roswasm/ros1"]
humble=["roswasm/ros2"]
jazzy=["roswasm/ros2"]
main=["roswasm/ros2"]
[dependencies]
roswasm={path="../../../../../../rust",default-features=false,features=["alloc"]}
