[package]
name = "uwvm-xarm-robot-msg-lesson"
version = "0.1.0"
edition = "2021"
publish = false
[features]
default = []
ros1 = ["roswasm/ros1"]
ros2 = ["roswasm/ros2"]
positive = []
[dependencies]
roswasm = { path = "../../../../rust", default-features = false, features = ["alloc"] }
[[bin]]
name = "xarm-robot-msg-lesson"
path = "lesson.rs"
[profile.release]
panic = "abort"
